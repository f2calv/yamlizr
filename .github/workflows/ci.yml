name: ci

on:
  workflow_dispatch:
    inputs:
      configuration:
        type: choice
        description: Build Configuration
        required: true
        default: Release
        options:
          - Release
          - Debug
      #The SemVer pre-release suffix (e.g. 1.2.3-my-feature.4) is what marks it preview to NuGet.
      push-preview:
        type: boolean
        description: Push a pre-release package?
        default: false
  push:
    branches-ignore:
      - "preview/**"
    paths-ignore:
      - .github/copilot-instructions.md
      - .github/dependabot.yml
      - .github/instructions/**
      - LICENSE
      - README.md
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

#Deny all by default; each job grants only the scopes it needs.
permissions: {}

jobs:
  lint:
    permissions:
      contents: read #checkout
    uses: f2calv/gha-workflows/.github/workflows/lint.yml@v1

  versioning:
    permissions:
      contents: read #checkout and release lookup
    uses: f2calv/gha-workflows/.github/workflows/gha-release-versioning.yml@v1
    with:
      tag-prefix: ''
      tag-and-release: false

  build:
    runs-on: ubuntu-latest
    needs: [versioning]
    #Note: a permissions block is subtractive - every scope not listed resets to none.
    #The composite action cannot request these itself, so they must be declared here.
    permissions:
      id-token: write #OIDC token for NuGet Trusted Publishing
      contents: read #checkout
      packages: write #push to nuget.pkg.github.com
    #The action runs the tests before it packs, so a conversion Azure DevOps rejects blocks every
    #publish. A fork pull request cannot read the token, which leaves the integration tests to skip
    #themselves rather than fail. The token is never echoed.
    env:
      CasCap__AzureDevOpsOptions__PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
      CasCap__AzureDevOpsOptions__OrganisationUri: ${{ vars.AZURE_DEVOPS_ORGANISATION_URI }}
      CasCap__AzureDevOpsOptions__Project: ${{ vars.AZURE_DEVOPS_PROJECT }}
      CasCap__AzureDevOpsOptions__ValidationPipelineId: ${{ vars.AZURE_DEVOPS_VALIDATION_PIPELINE_ID }}
    steps:
      - uses: f2calv/gha-dotnet-nuget@v2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          #The nuget.org username matches the GitHub owner. If they ever diverge this must
          #become a literal, or the token exchange fails with an opaque 401.
          nuget-user: ${{ github.repository_owner }}
          configuration: ${{ inputs.configuration || 'Release' }}
          push-preview: ${{ inputs.push-preview }}
          version: ${{ needs.versioning.outputs.version }}
          solution-name: yamlizr.Release.slnx

  image:
    uses: f2calv/gha-workflows/.github/workflows/container-image-build.yml@v1
    needs: [versioning, build]
    permissions:
      packages: write #push to ghcr.io
      contents: read #checkout
    with:
      registry: ghcr.io/${{ github.repository_owner }}
      tag: ${{ needs.versioning.outputs.version }}
      platform: linux/amd64,linux/arm64,linux/arm/v7
      push-image: ${{ github.ref_name == github.event.repository.default_branch }}
      args: --build-arg VERSION=${{ needs.versioning.outputs.version }}
      #A successful build does not prove the image runs. 3.1.6 shipped one that exited immediately
      #with "No frameworks were found". This runs on the single loaded architecture, before the
      #multi-architecture build, which then reuses those layers rather than rebuilding them.
      smoke-test: |
        VERSION=$(docker run --rm $IMAGE --version)
        echo "reported version: $VERSION"
        #SourceLink may append +<sha> to the informational version, so match the prefix
        case "$VERSION" in
          "${{ needs.versioning.outputs.version }}"*) ;;
          *) echo "::error::expected a version starting with ${{ needs.versioning.outputs.version }}, got $VERSION"; exit 1 ;;
        esac
        docker run --rm $IMAGE generate --help

  release:
    needs: [versioning, build, image]
    if: needs.versioning.outputs.release-exists == 'false'
      && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || inputs.push-preview == true)
    uses: f2calv/gha-workflows/.github/workflows/gha-release-versioning.yml@v1
    permissions:
      contents: write
    with:
      semVer: ${{ needs.versioning.outputs.version }}
      tag-prefix: ''
      move-major-tag: false
